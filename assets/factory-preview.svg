<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">The Software Factory — explore 32 repositories across seven areas</title>
<desc id="desc">A compact preview of Mike Hamanaka's software workshop. Factory core, workflows, evidence, machines and inference, simulation lab, publishing, and upstream collaborations. Open the interactive factory to search projects, inspect their roles, and take a guided tour.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121e31"/><stop offset="1" stop-color="#080f1c"/></linearGradient>
  <linearGradient id="core" x2="1" y2="1"><stop stop-color="#193d3c"/><stop offset="1" stop-color="#102634"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8ca5c2" opacity=".14"/></pattern>
</defs>
<rect x="1" y="1" width="958" height="378" rx="22" fill="url(#bg)" stroke="#31445b" stroke-width="2"/>
<rect x="2" y="2" width="956" height="376" rx="21" fill="url(#grid)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="34" y="32" width="32" height="32" rx="8" fill="#9df5d0"/>
  <path d="M42 54V44l6 4v-6l6 4v-5h5v13z" fill="#122b2d"/>
  <text x="78" y="53" fill="#cbd6e5" font-size="12" font-weight="700" letter-spacing="2.1">THE SOFTWARE FACTORY</text>
  <text x="34" y="133" fill="#f1f5fb" font-size="47" font-weight="750" letter-spacing="-1.9">One factory.</text>
  <text x="34" y="185" fill="#9df5d0" font-size="47" font-weight="750" letter-spacing="-1.9">Many ways in.</text>
  <text x="36" y="222" fill="#b2c1d5" font-size="15">32 repositories. Seven areas. A whole workshop.</text>
  <rect x="35" y="252" width="214" height="46" rx="12" fill="#9df5d0"/>
  <text x="54" y="281" fill="#10251f" font-size="16" font-weight="700">Explore the factory</text>
  <path d="M222 269l7 7-7 7m-9-7h16" fill="none" stroke="#10251f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="35" y="342" fill="#8fa3bf" font-size="11" letter-spacing="1.2">MIKE HAMANAKA  /  BUILT TO BE EXPLORED</text>
  <rect x="490" y="32" width="435" height="316" rx="16" fill="#0b1424" stroke="#304257"/>
  <text x="511" y="57" fill="#8fa3bf" font-size="10" letter-spacing="1.8">THE WORKSHOP, AT A GLANCE</text>
  <circle cx="898" cy="53" r="4" fill="#9df5d0"/>
  <rect x="510" y="74" width="395" height="69" rx="10" fill="url(#core)" stroke="#599e91"/>
  <text x="527" y="99" fill="#9df5d0" font-size="10" letter-spacing="1.3">01 / FACTORY CORE</text>
  <text x="527" y="124" fill="#eef7f6" font-size="19" font-weight="700">AI Dashboard + private engines</text>
  <text x="887" y="99" fill="#a2c7be" font-size="10" text-anchor="end">3 REPOS</text>
  <g fill="#142239" stroke="#324964"><rect x="510" y="155" width="125" height="65" rx="9"/><rect x="645" y="155" width="125" height="65" rx="9"/><rect x="780" y="155" width="125" height="65" rx="9"/><rect x="510" y="230" width="125" height="65" rx="9"/><rect x="645" y="230" width="125" height="65" rx="9"/><rect x="780" y="230" width="125" height="65" rx="9"/></g>
  <g font-size="10" letter-spacing=".7"><text x="523" y="175" fill="#a5c6ff">02 / 5 REPOS</text><text x="658" y="175" fill="#c8b3ff">03 / 6 REPOS</text><text x="793" y="175" fill="#ffd69b">04 / 4 REPOS</text><text x="523" y="250" fill="#f8accc">05 / 7 REPOS</text><text x="658" y="250" fill="#9bdbea">06 / 5 REPOS</text><text x="793" y="250" fill="#c7d2e6">07 / 2 REPOS</text></g>
  <g fill="#eef3fb" font-size="14" font-weight="600"><text x="523" y="201">Workflows</text><text x="658" y="201">Evidence</text><text x="793" y="201">Inference</text><text x="523" y="276">Simulation</text><text x="658" y="276">Publishing</text><text x="793" y="276">Upstream</text></g>
  <text x="511" y="326" fill="#8fa3bf" font-size="10">Search projects · Inspect roles · Take the tour</text>
