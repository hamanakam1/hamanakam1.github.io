name: Ecosystem contribution
description: Propose a useful improvement, adapter, fixture or experiment.
title: "[Ecosystem] "
body:
  - type: input
    id: project
    attributes:
      label: Project or interface
      description: Which public tool or generic interface would you like to improve?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed contribution
      description: Explain the user need, a small first slice, and how someone could try it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or synthetic example
      description: Share platform details, inputs, expected outputs and failure behavior. Omit credentials and private operational data.
  - type: textarea
    id: fit
    attributes:
      label: How could it fit the ecosystem?
      description: Describe a possible connection. Proposed integration is welcome; no private repository access is required.
